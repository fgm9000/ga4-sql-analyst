[project]
name = "ga4-sql-analyst"
version = "0.1.0"
description = "Text-to-SQL analytics over the GA4 sample dataset with deterministic guardrails"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Fabio Moura" }
]
dependencies = [
    "duckdb==2.0.0",
    "fastapi==0.162.7",
    "google-cloud-bigquery==3.47.0",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "pydantic-ai-slim[google]==2.68.0",
    "pydantic-evals==2.68.0",
    "pydantic-settings==2.16.3",
    "sqlglot==30.31.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pandas-stubs==3.1.0.261029",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ga4_sql_analyst"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"evals/**/*.py" = ["E402"]
"scripts/**/*.py" = ["E402", "S603", "S404"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
mypy_path = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
